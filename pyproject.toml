[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "anzeiger"
version = "0.12.0"
description = "Ein einfacher Textbrowser für HTTP und HTTPS (ohne CSS und JavaScript)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["Pillow>=10"]

[project.gui-scripts]
anzeiger = "anzeiger.app:main"

[tool.setuptools]
packages = ["anzeiger"]

[tool.setuptools.package-data]
anzeiger = ["changelog.html", "icons/*.png", "icons/*.svg", "lang/*.toml"]

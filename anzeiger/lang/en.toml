# Language file for Anzeiger: English
#
# Layout: sections in square brackets, below them  key = "text".
# - Words in curly braces such as {url} are placeholders that Anzeiger fills in.
#   They must appear unchanged in the translated text (in any order).
# - Keys ending in .one and .other are singular and plural (e.g. 1 cookie, 3 cookies).
# - Texts for the built-in pages (about:…) may contain HTML (<b>, <code>, <br> …).
# - Multi-line texts go between triple quotes """ … """.
#
# Rather than editing this file, save your changes in a file with the same name in
# ~/.config/anzeiger/lang/. It only needs the keys you change; everything else still
# comes from this file. To add a new language, copy this file there as e.g. fr.toml
# and translate it.


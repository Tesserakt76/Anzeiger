# Lingvodosiero de Anzeiger: Esperanto
#
# Strukturo: sekcioj en rektaj krampoj, sub ili  ŝlosilo = "teksto".
# - Vortoj en kuniklaj krampoj kiel {url} estas lokokupiloj, kiujn la Anzeiger anstataŭigas.
#   Ili devas aperi senŝanĝe en la tradukita teksto (en ajna ordo).
# - Ŝlosiloj kun .one kaj .other estas ununombro kaj multenombro (ekz. 1 kuketo, 3 kuketoj).
# - Tekstoj por la enkonstruitaj paĝoj (about:…) rajtas enhavi HTML (<b>, <code>, <br> …).
# - Plurliniaj tekstoj staras inter triobla citilo """ … """.
#
# Prefere ne ŝanĝu ĉi tiun dosieron, sed konservu viajn ŝanĝojn en samnoma dosiero en
# ~/.config/anzeiger/lang/. Tie sufiĉas la ŝanĝitaj ŝlosiloj; ĉiuj aliaj plu venas el
# ĉi tiu dosiero. Por aldoni novan lingvon, kopiu ĉi tiun dosieron tien ekz. kiel
# fr.toml kaj traduku ĝin.


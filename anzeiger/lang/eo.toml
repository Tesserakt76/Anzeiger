estas markita, tiaj partoj aperas falditaj malantaŭ „▸ Kaŝita: …“ kaj malfaldeblas per klako.
Sen marko ili aperas kiel normala enhavo. Rekoniĝas nur tio, kio staras rekte en la HTML-elemento
(<code>style="display:none"</code> aŭ <code>visibility:hidden</code>); partoj kaŝitaj per stilfolioj
ĉiam restas videblaj. Validas por paĝoj ŝargitaj post la konservado."""

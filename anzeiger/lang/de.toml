# Sprachdatei des Anzeigers: Deutsch (Referenzsprache, vollständig)
#
# Aufbau: Abschnitte in eckigen Klammern, darunter  schlüssel = "Text".
# - Wörter in geschweiften Klammern wie {url} sind Platzhalter, die der Anzeiger
#   ersetzt. Sie müssen unverändert im übersetzten Text vorkommen (Reihenfolge beliebig).
# - Schlüssel mit .one und .other sind Einzahl und Mehrzahl (z.B. 1 Cookie, 3 Cookies).
# - Texte für die eingebauten Seiten (about:…) dürfen HTML enthalten (<b>, <code>, <br> …).
# - Mehrzeilige Texte stehen zwischen dreifachen Anführungszeichen """ … """.
#
# Eigene Änderungen am besten nicht hier, sondern in einer Datei gleichen Namens in
# ~/.config/anzeiger/lang/ speichern. Dort genügen die geänderten Schlüssel; alle
# übrigen kommen weiter aus dieser Datei. Eine neue Sprache entsteht, indem man diese
# Datei z.B. als fr.toml in den Ordner kopiert und übersetzt.


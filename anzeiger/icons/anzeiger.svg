    <line x1="154" y1="138" x2="214" y2="138"/>
    <line x1="154" y1="153" x2="196" y2="153"/>
    <line x1="72" y1="180" x2="214" y2="180"/>
    <line x1="72" y1="195" x2="214" y2="195"/>
    <line x1="72" y1="210" x2="170" y2="210"/>
  </g>
</svg>

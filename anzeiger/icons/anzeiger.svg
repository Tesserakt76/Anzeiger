        transform="rotate(-7 123 138)"/>
  <!-- Titelseite -->
  <rect x="50" y="22" width="186" height="210" rx="14" fill="#fbf8ef" stroke="#2b2b2b" stroke-width="7"/>
  <!-- Zeitungskopf -->
  <rect x="68" y="42" width="150" height="32" rx="5" fill="#1f3a5f"/>
  <rect x="80" y="54" width="88" height="8" rx="4" fill="#fbf8ef"/>
  <line x1="68" y1="88" x2="218" y2="88" stroke="#2b2b2b" stroke-width="4"/>
  <!-- Bild -->
  <rect x="68" y="102" width="70" height="58" rx="4" fill="#3a7bd5"/>
